[project]
name = "ai-support-portal-backend"
version = "0.1.0"
description = "AI Support Portal backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "celery>=5.3",
  "structlog>=24.1",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mypy>=1.9",
  "ruff>=0.3",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
