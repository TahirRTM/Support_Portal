# Dev reverse proxy: /api -> FastAPI, everything else -> Next.js.
worker_processes auto;
events { worker_connections 1024; }
http {
  # Real client IP from the edge; only trust the docker network here.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream api { server api:8000; }
  upstream web { server frontend:3000; }

  server {
    listen 80;
    client_max_body_size 15m;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /docs { proxy_pass http://api; }
    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }
  }
}
