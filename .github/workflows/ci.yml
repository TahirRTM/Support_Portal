name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: aisupport }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aisupport
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aisupport
      REDIS_URL: redis://localhost:6379/0
      ACCESS_TOKEN_SECRET: ci-access-secret-that-is-quite-long-enough-1234
      REFRESH_TOKEN_SECRET: ci-refresh-secret-that-is-quite-long-enough-5678
      TURNSTILE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: cd backend && pip install -e '.[dev]'
      - name: Ruff
        run: cd backend && ruff check .
      - name: mypy
        run: cd backend && mypy app
      - name: Migrations check
        run: cd backend && alembic upgrade head
      - name: Tests
        run: cd backend && pytest -q
      - name: Bandit
        run: cd backend && bandit -r app -q
      - name: pip-audit
        run: cd backend && pip-audit || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm install
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aisupport-backend ./backend
      - run: docker build -t aisupport-frontend ./frontend
